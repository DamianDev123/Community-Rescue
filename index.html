<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>Community Rescue Map</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Community Rescue Map</h1>
      <p>McDowell County emergency help and first aid guide.</p>
    </div>
    <button id="installBtn" class="ghost">Install</button>
  </header>

  <main>
    <section class="panel">
      <div id="map"></div>
    </section>

    <section class="panel search-panel">
      <h2>Search symptoms or injuries</h2>
      <input id="searchInput" type="search" placeholder="Type chest pain, overdose, bleeding, choking..." autocomplete="off" />
      <div id="results" class="results"></div>
      <div id="guide" class="guide"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
